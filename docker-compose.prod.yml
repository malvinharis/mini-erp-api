# Production compose — API only. External managed Postgres (no local db service).
# Port bound to loopback: only the host's Nginx reaches it, never the internet.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mini-erp-api:latest
    container_name: mini-erp-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      # node 22 has global fetch — no curl needed in the image
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
